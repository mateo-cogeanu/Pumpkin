name: Fork Linux Release

on:
  push:
    branches: [fix/floating-trees-and-aquatic-mobs]
    paths:
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/fork-linux-release.yml"
      - ".github/scripts/boot_release.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-linux-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mateo-cogeanu/Pumpkin'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-linux-x86_64-musl
      - name: Build Linux release
        run: cargo build --locked --release -p pumpkin --target x86_64-unknown-linux-musl
      - name: Check executable and boot server
        run: |
          file target/x86_64-unknown-linux-musl/release/pumpkin
          python3 .github/scripts/boot_release.py target/x86_64-unknown-linux-musl/release/pumpkin --log boot-linux.log
      - name: Package executable
        run: |
          mkdir -p dist/package
          cp target/x86_64-unknown-linux-musl/release/pumpkin dist/package/pumpkin
          cp LICENSE dist/package/LICENSE
          cp FORK_MAINTENANCE.md dist/package/FORK_MAINTENANCE.md
          tar -C dist/package -czf dist/pumpkin-linux-x86_64-musl.tar.gz pumpkin LICENSE FORK_MAINTENANCE.md
          cd dist
          sha256sum pumpkin-linux-x86_64-musl.tar.gz > checksums.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: pumpkin-linux-x86_64-musl
          path: |
            dist/pumpkin-linux-x86_64-musl.tar.gz
            dist/checksums.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-boot-log
          path: boot-linux.log
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pumpkin-linux-x86_64-musl
          path: dist
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="fork-linux-$SOURCE_SHA"
          cat > release-notes.md <<'NOTES'
          Linux x86_64 release of the maintained Pumpkin fork, including tree soil and aquatic swimming fixes.

          Extract `pumpkin-linux-x86_64-musl.tar.gz` in your server folder, then run `chmod +x pumpkin` and `./pumpkin`. Configuration and world files are written in the current directory. Type `stop` to shut down cleanly.

          Built with the repository's optimized release profile and musl. The executable passed a native Linux startup and console shutdown check. Verify the archive with `sha256sum -c checksums.sha256`.
          NOTES
          gh release create "$TAG" dist/pumpkin-linux-x86_64-musl.tar.gz dist/checksums.sha256 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Pumpkin Linux x86_64 (${SOURCE_SHA:0:9})" --notes-file release-notes.md
